
name: Build PO Yakit Takip APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract project
        run: |
          unzip -q PO_Yakit_Takip_Android_Kaynak.zip -d .
          test -f PO_Yakit_Takip_Android/app/build.gradle.kts

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: PO_Yakit_Takip_Android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PO-Yakit-Takip-APK
          path: PO_Yakit_Takip_Android/app/build/outputs/apk/debug/app-debug.apk
